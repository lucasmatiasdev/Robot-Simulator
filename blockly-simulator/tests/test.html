<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>RS — Test harness (sin runner externo)</title>
<style>
  body { font-family: Consolas, monospace; padding: 16px; background: #10151c; color: #d6dee7; }
  .ok { color: #7ee787; }
  .fail { color: #ff7b72; font-weight: bold; }
  .grupo { margin-top: 18px; font-weight: bold; color: #79c0ff; }
  #resumen { margin-top: 20px; padding: 10px; border: 1px solid #30363d; }
</style>
</head>
<body>
<h1>RS — Test harness (double-click, no test runner)</h1>
<div id="salida"></div>
<div id="resumen"></div>

<!-- Modules under test. Blocks/toolbox are NOT loaded here: they require
     the Blockly global and are exercised only through fake block/workspace
     stubs below, matching the minimal API program-tree.js actually calls. -->
<script src="../src/config.js"></script>
<script src="../src/lessons/content.js"></script>
<script src="../src/lessons/check.js"></script>
<script src="../src/generator/program-tree.js"></script>
<script src="../src/generator/cpp-view.js"></script>
<script src="../src/sim/world.js"></script>
<script src="../src/sim/robot.js"></script>
<script src="../src/sim/sensors.js"></script>
<script src="../src/runtime/interpreter.js"></script>
<script src="../src/ui/code-panel.js"></script>
<script src="../src/ui/highlight.js"></script>
<script src="../src/ui/feedback.js"></script>
<script src="../src/runtime/scheduler.js"></script>

<script>
(function () {
  'use strict';

  var salida = document.getElementById('salida');
  var total = 0, fallidos = 0;
  var grupoActual = null;

  function grupo(nombre) {
    grupoActual = document.createElement('div');
    grupoActual.className = 'grupo';
    grupoActual.textContent = nombre;
    salida.appendChild(grupoActual);
  }

  function linea(texto, ok) {
    var div = document.createElement('div');
    div.className = ok ? 'ok' : 'fail';
    div.textContent = (ok ? 'PASS ' : 'FAIL ') + texto;
    salida.appendChild(div);
  }

  function assert(cond, mensaje) {
    total++;
    if (!cond) fallidos++;
    linea(mensaje, !!cond);
  }

  function iguales(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b) return false;
    if (a === null || b === null) return a === b;
    if (Array.isArray(a) || Array.isArray(b)) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
      for (var i = 0; i < a.length; i++) if (!iguales(a[i], b[i])) return false;
      return true;
    }
    if (typeof a === 'object') {
      var clavesA = Object.keys(a), clavesB = Object.keys(b);
      if (clavesA.length !== clavesB.length) return false;
      for (var j = 0; j < clavesA.length; j++) {
        var k = clavesA[j];
        if (!Object.prototype.hasOwnProperty.call(b, k) || !iguales(a[k], b[k])) return false;
      }
      return true;
    }
    return false;
  }

  function assertEquals(actual, esperado, mensaje) {
    var ok = iguales(actual, esperado);
    total++;
    if (!ok) fallidos++;
    linea(mensaje + (ok ? '' : (' — esperado ' + JSON.stringify(esperado) + ', obtuvo ' + JSON.stringify(actual))), ok);
  }

  // ---- Fake Blockly-less block/workspace stubs (minimal API used by program-tree.js) ----

  function bloqueAccion(type, id, valor) {
    return {
      type: type,
      id: id,
      _next: null,
      getInputTargetBlock: function (name) {
        if (name === 'MS') return { getFieldValue: function () { return valor; } };
        return null;
      },
      getFieldValue: function (name) {
        if (name === 'ESTADO') return String(valor);
        return null;
      },
      getNextBlock: function () { return this._next; }
    };
  }

  function encadenar() {
    var bloques = Array.prototype.slice.call(arguments);
    for (var i = 0; i < bloques.length - 1; i++) bloques[i]._next = bloques[i + 1];
    return bloques[0];
  }

  function bloqueRepetir(id, veces, cuerpoInicial) {
    return {
      type: 'rs_repetir', id: id, _next: null,
      getFieldValue: function (name) { return name === 'VECES' ? veces : null; },
      getInputTargetBlock: function (name) { return name === 'DO' ? cuerpoInicial : null; },
      getNextBlock: function () { return this._next; }
    };
  }

  function bloqueSi(id, cuerpoInicial) {
    return {
      type: 'rs_si_obstaculo', id: id, _next: null,
      getInputTargetBlock: function (name) { return name === 'DO' ? cuerpoInicial : null; },
      getNextBlock: function () { return this._next; }
    };
  }

  function bloqueSiCond(id, condBlock, cuerpoInicial) {
    return {
      type: 'rs_si_obstaculo', id: id, _next: null,
      getInputTargetBlock: function (name) {
        if (name === 'DO') return cuerpoInicial;
        if (name === 'COND') return condBlock;
        return null;
      },
      getNextBlock: function () { return this._next; }
    };
  }

  function bloqueSiSino(id, doInicial, elseInicial, condBlock) {
    return {
      type: 'rs_si_sino', id: id, _next: null,
      getInputTargetBlock: function (name) {
        if (name === 'DO') return doInicial;
        if (name === 'ELSE') return elseInicial;
        if (name === 'COND') return condBlock || null;
        return null;
      },
      getNextBlock: function () { return this._next; }
    };
  }

  function bloqueRepetirHasta(id, cuerpoInicial, condBlock) {
    return {
      type: 'rs_repetir_hasta', id: id, _next: null,
      getInputTargetBlock: function (name) {
        if (name === 'DO') return cuerpoInicial;
        if (name === 'COND') return condBlock || null;
        return null;
      },
      getNextBlock: function () { return this._next; }
    };
  }

  function bloqueMedirDistancia() {
    return { type: 'rs_medir_distancia' };
  }

  function bloqueNumero(valor) {
    return { type: 'rs_numero', getFieldValue: function (name) { return name === 'NUM' ? valor : null; } };
  }

  function bloqueComparar(op, izq, der) {
    return {
      type: 'rs_comparar',
      getFieldValue: function (name) { return name === 'OP' ? op : null; },
      getInputTargetBlock: function (name) {
        if (name === 'IZQ') return izq;
        if (name === 'DER') return der;
        return null;
      }
    };
  }

  function workspaceFalso(topBlocks) {
    return { getTopBlocks: function () { return topBlocks; } };
  }

  // ================= Ray-AABB / sensors determinism =================
  grupo('Sensores: ray-AABB y determinismo');
  (function () {
    RS.robot.reset();
    var d1 = RS.sensors.medirDistancia(RS.world, RS.robot.estado);
    var d2 = RS.sensors.medirDistancia(RS.world, RS.robot.estado);
    assertEquals(d1, d2, 'medirDistancia() es repetible para la misma pose');
    assert(d1 >= 0 && d1 <= RS.config.RANGO_MAX, 'medirDistancia() está en rango [0, RANGO_MAX]');

    // Place the robot directly against a known obstacle to check hayObstaculo().
    var obstaculo = RS.world.obstaculos[0]; // {x:300,y:220,w:60,h:140}
    var xCerca = obstaculo.x - 15; // 15px = ~3.75cm de distancia frontal
    RS.robot.commitPosicion(xCerca, obstaculo.y + obstaculo.h / 2);
    var cerca = RS.sensors.medirDistancia(RS.world, RS.robot.estado);
    assert(cerca <= RS.config.UMBRAL_OBSTACULO, 'cerca de un obstáculo, medirDistancia() <= UMBRAL_OBSTACULO');
    assert(RS.sensors.hayObstaculo(RS.world, RS.robot.estado) === true, 'hayObstaculo() true cuando medirDistancia() <= 20');
    RS.robot.reset();

    var lejos = RS.sensors.medirDistancia(RS.world, { x: 10, y: 10, angulo: 180 }); // apuntando fuera, hacia la pared cercana
    assert(typeof lejos === 'number', 'medirDistancia() siempre retorna un número');
  })();

  // ================= Robot kinematics =================
  grupo('Robot: cinemática');
  (function () {
    RS.robot.reset();
    var pose0 = { x: RS.robot.estado.x, y: RS.robot.estado.y };
    var candidato = RS.robot.proponerAvance(1000); // 1000ms * VEL(0.12) = 120px hacia heading 0 (este)
    assert(Math.abs(candidato.x - (pose0.x + 120)) < 0.001, 'avanzar(1000) mueve VEL*ms px sobre el heading (x)');
    assert(Math.abs(candidato.y - pose0.y) < 0.001, 'avanzar(1000) con heading 0 no cambia y');

    RS.robot.girar(500, 1); // derecha: +GIRO*ms = 0.18*500 = 90 grados
    assertEquals(RS.robot.estado.angulo, 90, 'girar derecha(500) rota GIRO*ms grados sin dividir por 4');
    RS.robot.reset();
  })();

  // ================= Tree generation =================
  grupo('Generador: árbol de programa (no aplanado)');
  (function () {
    var seq = encadenar(bloqueAccion('rs_avanzar', 'a1', 500), bloqueAccion('rs_led', 'l1', 1));
    var arbol = RS.generator.buildProgramTree(workspaceFalso([seq]));
    assertEquals(arbol, [
      { tipo: 'accion', accion: 'avanzar', blockId: 'a1', valor: 500 },
      { tipo: 'accion', accion: 'led', blockId: 'l1', valor: 1 }
    ], 'secuencia simple: avanzar(500) + led(1)');

    var cuerpoRepetir = bloqueAccion('rs_avanzar', 'a2', 200);
    var rep = bloqueRepetir('r1', 4, cuerpoRepetir);
    var arbolRep = RS.generator.buildProgramTree(workspaceFalso([rep]));
    assertEquals(arbolRep, [
      { tipo: 'repetir', veces: 4, blockId: 'r1', cuerpo: [
        { tipo: 'accion', accion: 'avanzar', blockId: 'a2', valor: 200 }
      ] }
    ], 'repetir(4) NO se pre-expande a 4 hojas: un solo nodo repetir con cuerpo de 1');

    var cuerpoSi = bloqueAccion('rs_detener', 's1', undefined);
    var si = bloqueSi('sif1', cuerpoSi);
    var arbolSi = RS.generator.buildProgramTree(workspaceFalso([si]));
    assertEquals(arbolSi, [
      { tipo: 'si', sensor: 'hayObstaculo', blockId: 'sif1', cuerpo: [
        { tipo: 'accion', accion: 'detener', blockId: 's1' }
      ] }
    ], 'si-hayObstaculo genera nodo "si" con cuerpo, condición no evaluada en generación');

    var payload = RS.protocol.toMqttPayload({ tipo: 'accion', accion: 'derecha', valor: 300, blockId: 'x' });
    assertEquals(payload, { accion: 'derecha', valor: 300 }, 'toMqttPayload despoja blockId/metadata, deja {accion,valor}');
    assertEquals(payload.valor, 300, 'turn value pasa sin dividir por 4 (300, no 75)');

    var vocabulario = RS.config.ACCIONES;
    assert(vocabulario.indexOf('bailar') === -1, 'bailar() ausente del vocabulario del generador');
    assertEquals(vocabulario, ['avanzar', 'retroceder', 'izquierda', 'derecha', 'detener', 'led'], 'vocabulario es exactamente el subconjunto de 6 acciones');
    assert(vocabulario.indexOf('esperar') === -1, 'esperar() NO forma parte de RS.config.ACCIONES (es solo simulador/sketch)');

    // rs_espera emite un nodo de acción 'esperar' con su valor MS.
    var arbolEspera = RS.generator.buildProgramTree(workspaceFalso([bloqueAccion('rs_espera', 'e1', 750)]));
    assertEquals(arbolEspera, [
      { tipo: 'accion', accion: 'esperar', blockId: 'e1', valor: 750 }
    ], 'rs_espera genera {tipo:"accion", accion:"esperar", valor}');

    // Caso por defecto (shadow rs_hay_obstaculo, o sin COND): nodo "si" byte-idéntico al de antes.
    var arbolSiDefault = RS.generator.buildProgramTree(workspaceFalso([bloqueSi('sifd', bloqueAccion('rs_detener', 'sd0', undefined))]));
    assertEquals(arbolSiDefault, [
      { tipo: 'si', sensor: 'hayObstaculo', blockId: 'sifd', cuerpo: [
        { tipo: 'accion', accion: 'detener', blockId: 'sd0' }
      ] }
    ], 'si-obstaculo sin comparador (shadow por defecto): nodo idéntico al comportamiento pre-existente');

    // Comparador como COND: nodo "si" con condicion {op, izq, der}.
    var comparador = bloqueComparar('>=', bloqueMedirDistancia(), bloqueNumero(260));
    var arbolSiComparador = RS.generator.buildProgramTree(workspaceFalso([bloqueSiCond('sifc', comparador, bloqueAccion('rs_detener', 'sd1', undefined))]));
    assertEquals(arbolSiComparador, [
      { tipo: 'si', blockId: 'sifc', condicion: { op: '>=', izq: { k: 'medirDistancia' }, der: { k: 'numero', v: 260 } }, cuerpo: [
        { tipo: 'accion', accion: 'detener', blockId: 'sd1' }
      ] }
    ], 'si con rs_comparar en COND: nodo "si" con condicion {op, izq, der}');

    // rs_si_sino: nodo "si_sino" con COND por defecto (shadow rs_hay_obstaculo).
    var arbolSiSinoDefault = RS.generator.buildProgramTree(workspaceFalso([
      bloqueSiSino('ssd1', bloqueAccion('rs_derecha', 'ss-do', 500), bloqueAccion('rs_avanzar', 'ss-else', 1000))
    ]));
    assertEquals(arbolSiSinoDefault, [
      { tipo: 'si_sino', sensor: 'hayObstaculo', blockId: 'ssd1',
        cuerpo: [{ tipo: 'accion', accion: 'derecha', blockId: 'ss-do', valor: 500 }],
        sino: [{ tipo: 'accion', accion: 'avanzar', blockId: 'ss-else', valor: 1000 }] }
    ], 'si_sino (shadow por defecto): nodo con sensor:"hayObstaculo", cuerpo (DO) y sino (ELSE)');

    // rs_si_sino: comparador como COND.
    var comparadorSiSino = bloqueComparar('<', bloqueMedirDistancia(), bloqueNumero(20));
    var arbolSiSinoComparador = RS.generator.buildProgramTree(workspaceFalso([
      bloqueSiSino('ssc1', bloqueAccion('rs_detener', 'ssc-do', undefined), null, comparadorSiSino)
    ]));
    assertEquals(arbolSiSinoComparador, [
      { tipo: 'si_sino', blockId: 'ssc1',
        condicion: { op: '<', izq: { k: 'medirDistancia' }, der: { k: 'numero', v: 20 } },
        cuerpo: [{ tipo: 'accion', accion: 'detener', blockId: 'ssc-do' }],
        sino: [] }
    ], 'si_sino con rs_comparar en COND: nodo con condicion {op, izq, der}; ELSE vacio -> sino:[]');

    // rs_repetir_hasta: nodo "repetir_hasta" con COND por defecto (shadow rs_hay_obstaculo).
    var arbolRepetirHastaDefault = RS.generator.buildProgramTree(workspaceFalso([
      bloqueRepetirHasta('rhd1', bloqueAccion('rs_avanzar', 'rh-do', 100))
    ]));
    assertEquals(arbolRepetirHastaDefault, [
      { tipo: 'repetir_hasta', sensor: 'hayObstaculo', blockId: 'rhd1',
        cuerpo: [{ tipo: 'accion', accion: 'avanzar', blockId: 'rh-do', valor: 100 }] }
    ], 'repetir_hasta (shadow por defecto): nodo con sensor:"hayObstaculo" y cuerpo (DO)');

    // rs_repetir_hasta: comparador como COND.
    var comparadorRepetirHasta = bloqueComparar('>=', bloqueMedirDistancia(), bloqueNumero(20));
    var arbolRepetirHastaComparador = RS.generator.buildProgramTree(workspaceFalso([
      bloqueRepetirHasta('rhc1', bloqueAccion('rs_avanzar', 'rhc-do', 100), comparadorRepetirHasta)
    ]));
    assertEquals(arbolRepetirHastaComparador, [
      { tipo: 'repetir_hasta', blockId: 'rhc1',
        condicion: { op: '>=', izq: { k: 'medirDistancia' }, der: { k: 'numero', v: 20 } },
        cuerpo: [{ tipo: 'accion', accion: 'avanzar', blockId: 'rhc-do', valor: 100 }] }
    ], 'repetir_hasta con rs_comparar en COND: nodo con condicion {op, izq, der}');

    // rs_repetir_hasta: cuerpo vacio -> cuerpo:[] (no se cae, no lanza excepcion en generacion).
    var arbolRepetirHastaVacio = RS.generator.buildProgramTree(workspaceFalso([bloqueRepetirHasta('rhv1', null)]));
    assertEquals(arbolRepetirHastaVacio, [
      { tipo: 'repetir_hasta', sensor: 'hayObstaculo', blockId: 'rhv1', cuerpo: [] }
    ], 'repetir_hasta con cuerpo vacio: nodo generado con cuerpo:[]');
  })();

  // ================= cppView: Arduino sketch generator =================
  grupo('cppView: sketch Arduino UNO compilable');
  (function () {
    var arbol = [
      { tipo: 'accion', accion: 'avanzar', valor: 1000, blockId: 'a1' },
      { tipo: 'si', sensor: 'hayObstaculo', blockId: 's1', cuerpo: [
        { tipo: 'accion', accion: 'detener', blockId: 'd1' }
      ] },
      { tipo: 'repetir', veces: 4, blockId: 'r1', cuerpo: [
        { tipo: 'accion', accion: 'izquierda', valor: 500, blockId: 'i1' }
      ] }
    ];
    var resultado = RS.cppView.render(arbol);
    var texto = RS.cppView.renderTexto(arbol);

    // --- Structure ---
    var numSetup = (texto.match(/void setup\(\)/g) || []).length;
    var numLoop = (texto.match(/void loop\(\)/g) || []).length;
    assertEquals(numSetup, 1, 'exactamente un void setup()');
    assertEquals(numLoop, 1, 'exactamente un void loop()');

    // --- No networking identifiers ---
    assert(texto.indexOf('WiFi') === -1, 'el sketch no referencia WiFi');
    assert(texto.indexOf('MQTT') === -1, 'el sketch no referencia MQTT');
    assert(texto.indexOf('PubSubClient') === -1, 'el sketch no referencia PubSubClient');

    // --- Pin config before use ---
    var idxPinMode = texto.indexOf('pinMode(ENA, OUTPUT)');
    var idxAvanzarDef = texto.indexOf('void avanzar');
    var idxSetup = texto.indexOf('void setup()');
    assert(idxPinMode !== -1, 'pinMode(ENA, OUTPUT) esta presente');
    assert(idxPinMode > idxSetup, 'pinMode ocurre dentro de setup()');
    assert(idxAvanzarDef !== -1 && idxAvanzarDef < idxSetup, 'avanzar() se define antes de setup() (donde se llama)');

    // --- Direction table: girarIzquierda = motor1 atras (L,H), motor2 adelante (H,L) ---
    var idxIzq = texto.indexOf('void girarIzquierda');
    var idxIzqFin = texto.indexOf('}', idxIzq);
    var cuerpoIzq = texto.substring(idxIzq, idxIzqFin);
    assert(/digitalWrite\(IN1, LOW\)/.test(cuerpoIzq), 'girarIzquierda: IN1 LOW');
    assert(/digitalWrite\(IN2, HIGH\)/.test(cuerpoIzq), 'girarIzquierda: IN2 HIGH');
    assert(/digitalWrite\(IN3, HIGH\)/.test(cuerpoIzq), 'girarIzquierda: IN3 HIGH');
    assert(/digitalWrite\(IN4, LOW\)/.test(cuerpoIzq), 'girarIzquierda: IN4 LOW');

    // --- si node: comment present, no fabricated hayObstaculo() call in the guion ---
    var lineaSi = resultado.lineas.filter(function (l) { return l.blockId === 's1'; })[0];
    assert(lineaSi !== undefined, 'el nodo si mapea su blockId a una linea');
    assert(lineaSi.texto.indexOf('ATENCION') !== -1, 'el nodo si genera un comentario ATENCION');
    var lineasGuion = resultado.lineas.filter(function (l) { return l.seccion === 'guion'; });
    var llamadaFabricada = lineasGuion.some(function (l) { return l.texto.indexOf('hayObstaculo()') !== -1 && l.texto.indexOf('//') !== 0; });
    assert(!llamadaFabricada, 'ninguna linea de guion contiene una llamada real a hayObstaculo()');
    assert(resultado.lineas.filter(function (l) { return l.blockId === 'd1'; }).length === 0, 'el cuerpo del si (detener) NO se traduce a codigo ejecutable');

    // --- repetir: real for loop (compilable), header maps blockId, close brace does not ---
    var lineaRepetir = resultado.lineas.filter(function (l) { return l.blockId === 'r1'; })[0];
    assert(/^for \(int i = 0; i < 4; i\+\+\) \{$/.test(lineaRepetir.texto), 'repetir(4) se desenrolla como for real compilable');
    assertEquals(resultado.lineasPorBloque.r1.length, 1, 'nodo repetir mapea solo su linea de cabecera');

    // --- loop() has no movement calls ---
    var idxLoop = texto.indexOf('void loop()');
    var cuerpoLoop = texto.substring(idxLoop);
    assert(!/\bavanzar\(|\bretroceder\(|\bgirarIzquierda\(|\bgirarDerecha\(/.test(cuerpoLoop), 'loop() no llama a ninguna funcion de movimiento');

    // --- sensor stub only emitted when tree uses a sensor node ---
    var textoSinSensor = RS.cppView.renderTexto([{ tipo: 'accion', accion: 'avanzar', valor: 100, blockId: 'x1' }]);
    assert(textoSinSensor.indexOf('hayObstaculo') === -1, 'sin nodo si en el arbol, no se emite el stub de sensor');
    assert(texto.indexOf('bool hayObstaculo') !== -1, 'con nodo si en el arbol, se emite el stub hayObstaculo()');

    // --- si_sino: honest-stub emission (never fabricates a real hayObstaculo() call) ---
    var arbolSiSino = [
      { tipo: 'si_sino', sensor: 'hayObstaculo', blockId: 'ss1',
        cuerpo: [{ tipo: 'accion', accion: 'derecha', valor: 500, blockId: 'dd1' }],
        sino: [{ tipo: 'accion', accion: 'avanzar', valor: 1000, blockId: 'de1' }] }
    ];
    var resultadoSiSino = RS.cppView.render(arbolSiSino);
    var textoSiSino = RS.cppView.renderTexto(arbolSiSino);
    var lineaSiSino = resultadoSiSino.lineas.filter(function (l) { return l.blockId === 'ss1'; })[0];
    assert(lineaSiSino !== undefined, 'el nodo si_sino mapea su blockId a una linea');
    assert(lineaSiSino.texto.indexOf('ATENCION') !== -1, 'el nodo si_sino genera un comentario ATENCION');
    assert(resultadoSiSino.lineas.filter(function (l) { return l.blockId === 'dd1'; }).length === 0, 'el cuerpo DO de si_sino NO se traduce a codigo ejecutable');
    assert(resultadoSiSino.lineas.filter(function (l) { return l.blockId === 'de1'; }).length === 0, 'el cuerpo ELSE de si_sino NO se traduce a codigo ejecutable');
    var lineasGuionSiSino = resultadoSiSino.lineas.filter(function (l) { return l.seccion === 'guion'; });
    var llamadaFabricadaSiSino = lineasGuionSiSino.some(function (l) { return l.texto.indexOf('hayObstaculo()') !== -1 && l.texto.indexOf('//') !== 0; });
    assert(!llamadaFabricadaSiSino, 'ninguna linea de guion de si_sino contiene una llamada real a hayObstaculo()');
    assert(textoSiSino.indexOf('bool hayObstaculo') !== -1, 'usaSensor() detecta si_sino: se emite el stub hayObstaculo() aunque no haya nodo "si" plano');

    // --- repetir_hasta: honest-stub emission (never fabricates a real hayObstaculo() call) ---
    var arbolRepetirHasta = [
      { tipo: 'repetir_hasta', sensor: 'hayObstaculo', blockId: 'rh1', cuerpo: [
        { tipo: 'accion', accion: 'avanzar', valor: 100, blockId: 'rhd1' }
      ] }
    ];
    var resultadoRepetirHasta = RS.cppView.render(arbolRepetirHasta);
    var textoRepetirHasta = RS.cppView.renderTexto(arbolRepetirHasta);
    var lineaRepetirHasta = resultadoRepetirHasta.lineas.filter(function (l) { return l.blockId === 'rh1'; })[0];
    assert(lineaRepetirHasta !== undefined, 'el nodo repetir_hasta mapea su blockId a una linea');
    assert(lineaRepetirHasta.texto.indexOf('ATENCION') !== -1, 'el nodo repetir_hasta genera un comentario ATENCION');

  (function () {
    // --- Condicion ya verdadera al llegar: cero iteraciones (pre-test) ---
    var condicionSiempreVerdadera = { op: '==', izq: { k: 'numero', v: 1 }, der: { k: 'numero', v: 1 } };
    var arbolCondicionInicialVerdadera = [

    assertEquals(walkerSkip.limiteSeguridad(), null, 'repetir_hasta sin trip: limiteSeguridad() es null');

    // --- Condicion se vuelve verdadera tras N pasadas: exactamente N pasadas, re-evaluada entre pasadas ---
    // Usa el patron real: comparador sobre medirDistancia() con una pose que
    // se acerca manualmente al obstaculo entre llamadas a siguienteNodo(),
    // simulando lo que el scheduler real hace entre iteraciones.
    var obstaculoRH = RS.world.obstaculos[0]; // {x:300,y:220,w:60,h:140}
    RS.robot.commitPosicion(80, obstaculoRH.y + obstaculoRH.h / 2); // lejos, mirando al obstaculo (angulo 0)
    var condicionCerca = { op: '<', izq: { k: 'medirDistancia' }, der: { k: 'numero', v: 15 } };
    var arbolAcercamiento = [
      { tipo: 'repetir_hasta', blockId: 'rh-acerca', condicion: condicionCerca, cuerpo: [
        { tipo: 'accion', accion: 'avanzar', valor: 100, blockId: 'paso-acerca' }
      ] },
      { tipo: 'accion', accion: 'led', valor: 1, blockId: 'despues-acerca' }
    ];
    var walkerAcerca = RS.runtime.interpreter.crear(arbolAcercamiento, RS.world, RS.robot.estado, null);
    var vistosAcerca = [];
    var nAcerca = walkerAcerca.siguienteNodo();
    var pasosAcerca = 0;
    while (nAcerca !== null && pasosAcerca < 50) {
      vistosAcerca.push(nAcerca.blockId);
      if (nAcerca.blockId === 'paso-acerca') {
        // Simula al scheduler avanzando al robot antes de re-evaluar la condicion.
        RS.robot.commitPosicion(RS.robot.estado.x + 20, RS.robot.estado.y);
      }
      pasosAcerca++;
      nAcerca = walkerAcerca.siguienteNodo();
    }
    assert(vistosAcerca.length > 1, 'repetir_hasta (acercandose): el cuerpo se yieldea mas de una vez antes de que la condicion se cumpla');
    assertEquals(vistosAcerca[vistosAcerca.length - 1], 'despues-acerca', 'repetir_hasta (acercandose): al cumplirse la condicion, el programa continua tras el loop');
    assert(vistosAcerca.slice(0, -1).every(function (id) { return id === 'paso-acerca'; }), 'repetir_hasta (acercandose): solo hojas del cuerpo se yieldean mientras la condicion es falsa');
    assertEquals(walkerAcerca.limiteSeguridad(), null, 'repetir_hasta (acercandose, salida normal por condicion): limiteSeguridad() es null');
    RS.robot.reset();

    // --- Safety cap: empty body / never-true condition terminates at exactly MAX_ITER_REPETIR_HASTA ---
    var condicionNuncaVerdadera = { op: '==', izq: { k: 'numero', v: 1 }, der: { k: 'numero', v: 2 } };
    var arbolCapVacio = [
      { tipo: 'repetir_hasta', blockId: 'rh-cap', condicion: condicionNuncaVerdadera, cuerpo: [] },

    assertEquals(walkerCap.limiteSeguridad(), { blockId: 'rh-cap', iteraciones: RS.config.MAX_ITER_REPETIR_HASTA },
      'repetir_hasta: al disparar el limite, limiteSeguridad() = {blockId, iteraciones: MAX_ITER_REPETIR_HASTA}');

    // --- Safety cap does not fire when the body has real leaf actions and the ---
    // --- condition never becomes true either: still bounded, still yields exactly MAX_ITER leaves ---
    var arbolCapConCuerpo = [
      { tipo: 'repetir_hasta', blockId: 'rh-cap2', condicion: condicionNuncaVerdadera, cuerpo: [
        { tipo: 'accion', accion: 'led', valor: 1, blockId: 'iter-cap2' }
      ] }
    ];
    var walkerCap2 = RS.runtime.interpreter.crear(arbolCapConCuerpo, RS.world, RS.robot.estado, null);
    var pasosCap2 = 0;
    var nodoCap2 = walkerCap2.siguienteNodo();
    while (nodoCap2 !== null) { pasosCap2++; nodoCap2 = walkerCap2.siguienteNodo(); }
    assertEquals(pasosCap2, RS.config.MAX_ITER_REPETIR_HASTA, 'repetir_hasta con cuerpo no vacio y condicion que nunca se cumple: se yieldean exactamente MAX_ITER_REPETIR_HASTA hojas antes de terminar');
    assertEquals(walkerCap2.limiteSeguridad(), { blockId: 'rh-cap2', iteraciones: RS.config.MAX_ITER_REPETIR_HASTA }, 'repetir_hasta con cuerpo no vacio: tambien dispara limiteSeguridad al llegar al tope');
  })();

  (function () {

  (function () {

    var obstaculo = RS.world.obstaculos[0]; // {x:300,y:220,w:60,h:140}; robot arranca en x:80,y:300,angulo:0

    // Reproduce el bug reportado: avanzar(4000) contra un obstáculo delgado
    // en el medio del camino. Antes del fix, un único frame real de
    // requestAnimationFrame con dt grande (pestaña en 2do plano, hiccup del
    // dispositivo, etc.) podía mover al robot de un lado al otro del
    // obstáculo en un solo salto, sin que ninguna posición intermedia
    // overlapeara y sin disparar colisión nunca. Se simula ese frame grande
    // llamando _procesarFrame(4000) una única vez, como si rAF hubiera

    var arbol = [{ tipo: 'accion', accion: 'avanzar', valor: 4000, blockId: 'a-largo' }];
    scheduler.iniciarConArbol(arbol);
    assertEquals(scheduler.obtenerEstado(), 'running', 'arranca en estado running');

    scheduler._procesarFrame(4000); // un único frame gigante cubre todo el movimiento

    // Detención manual: falla, describe la interrupción.
    var fallaDetenido = RS.lessons.check.evaluar(leccion2, { estado: { x: 200 }, resultadoRun: 'stopped' });
    assert(fallaDetenido.ok === false, 'check.evaluar: resultadoRun="stopped" (detenido manualmente) falla');

    // Lección 1 (sin criterio): evaluar() devuelve ok:false y un mensaje explicando por qué.
    var leccion1 = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 1; })[0];
    var sinCriterio = RS.lessons.check.evaluar(leccion1, { estado: { x: 999 }, resultadoRun: 'idle' });
    assert(sinCriterio.ok === false, 'Lección 1 (criterio: null): check.evaluar no puede dar exito');
  })();

  // ================= Lessons 3-4: content, criteria, metrics infra (Slice A) =================
  grupo('Lecciones 3-4: contenido, criterios y métricas (evalsSensor)');
  (function () {
    var leccion3 = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 3; })[0];
    var leccion4 = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 4; })[0];
    assert(!!leccion3 && !!leccion3.criterio, 'Lección 3 tiene un criterio.evaluar definido');
    assert(!!leccion4 && !!leccion4.criterio, 'Lección 4 tiene un criterio.evaluar definido');

    // --- Lesson 3: reference pose passes, short of the target region fails ---
    var pasaL3 = RS.lessons.check.evaluar(leccion3, { estado: { x: 200, y: 420 }, resultadoRun: 'idle' });
    assert(pasaL3.ok === true, 'Lección 3: pose de referencia (x=200,y=420) cumple el criterio');

    var fallaCortoL3 = RS.lessons.check.evaluar(leccion3, { estado: { x: 100, y: 300 }, resultadoRun: 'idle' });
    assert(fallaCortoL3.ok === false, 'Lección 3: robot corto de la región objetivo falla');
    assert(fallaCortoL3.observado.toLowerCase().indexOf('avanzar') === -1 && fallaCortoL3.observado.toLowerCase().indexOf('bloque') === -1,
      'Lección 3: el mensaje de falla describe comportamiento, no nombra un bloque');

    var fallaSinGiroL3 = RS.lessons.check.evaluar(leccion3, { estado: { x: 200, y: 300 }, resultadoRun: 'idle' });
    assert(fallaSinGiroL3.ok === false, 'Lección 3: avanzar sin girar (misma altura) falla aunque x sea suficiente');

    // --- Lesson 4: criterion depends on evalsSensor, not just position ---
    var pasaL4 = RS.lessons.check.evaluar(leccion4, {
      estado: { x: 240, y: 300 }, resultadoRun: 'idle', metricas: { evalsSensor: 1, limiteSeguridad: null }
    });
    assert(pasaL4.ok === true, 'Lección 4: posición correcta + sensor consultado cumple el criterio');

    var fallaSinSensorL4 = RS.lessons.check.evaluar(leccion4, {
      estado: { x: 240, y: 300 }, resultadoRun: 'idle', metricas: { evalsSensor: 0, limiteSeguridad: null }
    });
    assert(fallaSinSensorL4.ok === false, 'Lección 4: posición correcta SIN consultar el sensor falla (no basta con la posición)');
    assert(fallaSinSensorL4.observado.indexOf('sensor') !== -1, 'Lección 4: el mensaje de falla menciona que el sensor no fue consultado');
    assert(fallaSinSensorL4.observado.toLowerCase().indexOf('bloque') === -1, 'Lección 4: el mensaje de falla no nombra un bloque');

    var fallaFueraDeZonaL4 = RS.lessons.check.evaluar(leccion4, {
      estado: { x: 400, y: 300 }, resultadoRun: 'idle', metricas: { evalsSensor: 1, limiteSeguridad: null }
    });
    assert(fallaFueraDeZonaL4.ok === false, 'Lección 4: sensor consultado pero posición fuera de la zona segura falla');

    // --- obtenerMetricas() shape after a run with no repetir_hasta ---
    var scheduler = RS.runtime.scheduler;
    var feedbackDiv4 = document.createElement('div');
    document.body.appendChild(feedbackDiv4);
    RS.ui.feedback.init(feedbackDiv4);

    var arbolSensor = [
      { tipo: 'accion', accion: 'avanzar', valor: 1300, blockId: 'a1' },
      { tipo: 'si', sensor: 'hayObstaculo', blockId: 's1', cuerpo: [
        { tipo: 'accion', accion: 'detener', blockId: 'd1' }
      ] }
    ];
    scheduler.iniciarConArbol(arbolSensor);
    for (var i = 0; i < 500 && scheduler.obtenerEstado() === 'running'; i++) {
      scheduler._procesarFrame(16);
    }
    var metricasFinales = scheduler.obtenerMetricas();
    assertEquals(scheduler.obtenerEstado(), 'idle', 'la ejecución con si-sensor termina en idle (sin colisión)');
    assert(metricasFinales.evalsSensor >= 1, 'obtenerMetricas().evalsSensor >= 1 tras evaluar el bloque si-sensor al menos una vez');
    assertEquals(metricasFinales.limiteSeguridad, null, 'obtenerMetricas().limiteSeguridad es null (no hay repetir_hasta en esta slice)');

    // The reference program (ejemplo de la Lección 4) actually satisfies its
    // own pinned criterion when run end-to-end through the real scheduler.
    var snapshotRealL4 = { estado: RS.robot.estado, resultadoRun: scheduler.obtenerEstado(), metricas: metricasFinales };
    var resultadoRealL4 = RS.lessons.check.evaluar(leccion4, snapshotRealL4);
    assert(resultadoRealL4.ok === true, 'Lección 4: el programa de referencia (avanzar+si-hayObstaculo) cumple su propio criterio en una corrida real');

    scheduler.reiniciar();
    document.body.removeChild(feedbackDiv4);

    // Confirm iniciarConArbol() resets the counters for the next run.
    scheduler.iniciarConArbol([{ tipo: 'accion', accion: 'led', valor: 1, blockId: 'l1' }]);
    var metricasNuevaCorrida = scheduler.obtenerMetricas();
    assertEquals(metricasNuevaCorrida, { evalsSensor: 0, limiteSeguridad: null }, 'iniciarConArbol() resetea evalsSensor/limiteSeguridad al comenzar una nueva corrida');
    scheduler.reiniciar();
  })();

  // ================= Lesson 5: rs_si_sino + criterion (Slice B) =================
  grupo('Lección 5: contenido, exactamente un bloque nuevo, criterio compuesto (evalsSensor + posición)');
  (function () {
    var leccion4b = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 4; })[0];
    var leccion5 = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 5; })[0];
    assert(!!leccion5 && !!leccion5.criterio, 'Lección 5 tiene un criterio.evaluar definido');
    assert(leccion5.bloques.indexOf('si no') !== -1, 'Lección 5 introduce el bloque "si / si no"');
    assert(leccion4b.bloques.indexOf('si no') === -1, 'Lección 4 no menciona "si no" (bloque introducido recién en Lección 5)');

    // --- Compound: passes on correct zone with no collision, fails on collision even if position matches ---
    var pasaL5 = RS.lessons.check.evaluar(leccion5, {
      estado: { x: 224, y: 420 }, resultadoRun: 'idle', metricas: { evalsSensor: 1, limiteSeguridad: null }
    });
    assert(pasaL5.ok === true, 'Lección 5: pose de referencia (x=224,y=420) con sensor consultado cumple el criterio');

    var fallaColisionL5 = RS.lessons.check.evaluar(leccion5, {
      estado: { x: 224, y: 420 }, resultadoRun: 'error', metricas: { evalsSensor: 1, limiteSeguridad: null }
    });
    assert(fallaColisionL5.ok === false, 'Lección 5: misma posición pero con colisión (resultadoRun=error) falla');

    var fallaSinSensorL5 = RS.lessons.check.evaluar(leccion5, {
      estado: { x: 224, y: 420 }, resultadoRun: 'idle', metricas: { evalsSensor: 0, limiteSeguridad: null }
    });
    assert(fallaSinSensorL5.ok === false, 'Lección 5: posición correcta SIN consultar el sensor falla');
    assert(fallaSinSensorL5.observado.toLowerCase().indexOf('bloque') === -1, 'Lección 5: el mensaje de falla no nombra un bloque');

    var fallaSinAlejarseL5 = RS.lessons.check.evaluar(leccion5, {
      estado: { x: 224, y: 300 }, resultadoRun: 'idle', metricas: { evalsSensor: 1, limiteSeguridad: null }
    });
    assert(fallaSinAlejarseL5.ok === false, 'Lección 5: sensor consultado pero sin cambio de altura falla (rama tomada no cambió de dirección)');

    // --- Lesson 5's own reference program satisfies its own criterion, run end-to-end ---
    var scheduler5 = RS.runtime.scheduler;
    var feedbackDiv5 = document.createElement('div');
    document.body.appendChild(feedbackDiv5);
    RS.ui.feedback.init(feedbackDiv5);

    var arbolL5 = [
      { tipo: 'accion', accion: 'avanzar', valor: 1200, blockId: 'a1' },
      { tipo: 'si_sino', sensor: 'hayObstaculo', blockId: 'ss1',
        cuerpo: [{ tipo: 'accion', accion: 'derecha', valor: 500, blockId: 'd1' }],
        sino: [] },
      { tipo: 'accion', accion: 'avanzar', valor: 1000, blockId: 'a2' }
    ];
    scheduler5.iniciarConArbol(arbolL5);
    for (var i = 0; i < 500 && scheduler5.obtenerEstado() === 'running'; i++) {
      scheduler5._procesarFrame(16);
    }
    assertEquals(scheduler5.obtenerEstado(), 'idle', 'Lección 5: el programa de referencia termina en idle (sin colisión)');
    var snapshotRealL5 = { estado: RS.robot.estado, resultadoRun: scheduler5.obtenerEstado(), metricas: scheduler5.obtenerMetricas() };
    var resultadoRealL5 = RS.lessons.check.evaluar(leccion5, snapshotRealL5);
    assert(resultadoRealL5.ok === true, 'Lección 5: el programa de referencia (avanzar+si_sino+avanzar) cumple su propio criterio en una corrida real');

    scheduler5.reiniciar();
    document.body.removeChild(feedbackDiv5);
  })();

  // ================= Regresión: bloques y lecciones pre-existentes sin cambios =================
  grupo('Regresión: bloques pre-existentes y Lecciones 1-2 sin cambios (Slice B)');
  (function () {
    // Same pre-existing-block-only tree as before rs_si_sino existed: byte-identical output.
    var arbolPreexistente = [
      { tipo: 'accion', accion: 'avanzar', valor: 1000, blockId: 'a1' },
      { tipo: 'si', sensor: 'hayObstaculo', blockId: 's1', cuerpo: [
        { tipo: 'accion', accion: 'detener', blockId: 'd1' }
      ] },
      { tipo: 'repetir', veces: 4, blockId: 'r1', cuerpo: [
        { tipo: 'accion', accion: 'izquierda', valor: 500, blockId: 'i1' }
      ] }
    ];
    var reg1 = RS.cppView.renderTexto(arbolPreexistente);
    var reg2 = RS.cppView.renderTexto(arbolPreexistente);
    assertEquals(reg1, reg2, 'cppView.renderTexto es determinista/byte-idéntico para un árbol sin si_sino');

    var leccion1 = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 1; })[0];
    var leccion2 = RS.lessons.CONTENIDO.filter(function (l) { return l.id === 2; })[0];
    assert(leccion1.criterio === null, 'Lección 1 sigue sin criterio (sin cambios)');
    assert(typeof leccion2.criterio.evaluar === 'function', 'Lección 2 conserva su criterio.evaluar (sin cambios)');
    assertEquals(RS.lessons.CONTENIDO.map(function (l) { return l.id; }), [1, 2, 3, 4, 5], 'RS.lessons.CONTENIDO expone Lecciones 1 a 5 en orden de id');
  })();

  // ================= Summary =================
  var resumen = document.getElementById('resumen');
  resumen.className = fallidos === 0 ? 'ok' : 'fail';
  resumen.textContent = (fallidos === 0 ? 'TODOS LOS TESTS PASARON ' : (fallidos + ' TEST(S) FALLARON ')) +
    '(' + (total - fallidos) + '/' + total + ')';
})();
</script>
